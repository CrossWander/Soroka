<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data: https://teams.public.onecdn.static.microsoft; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Soroka</title>
<style>
  /* A card in the corner above the clock: slides up, lives a few seconds, stays while the mouse is on it.
     The window grows upward for the "⋯" menu, so the card sits at the bottom of the page. */
  :root { color-scheme: light dark; --card: #ffffff; --fg: #1d1d1b; --muted: #616161; --line: rgba(0,0,0,.08); --accent: #5b5fc7; --on-accent: #ffffff; --error: #c4314b; --btn: rgba(0,0,0,.05); --btn-hover: rgba(0,0,0,.1); --field: #f5f5f5; --menu: #ffffff;
    --p1: #0f7b6c; --p2: #a15c00; }
  @media (prefers-color-scheme: dark) { :root { --card: #2b2b2b; --fg: #f3f3f3; --muted: #b3b3b3; --line: rgba(255,255,255,.08); --accent: #9ea2ff; --on-accent: #16171d; --error: #ff8a9e; --btn: rgba(255,255,255,.07); --btn-hover: rgba(255,255,255,.13); --field: #1f1f1f; --menu: #323232;
    --p1: #6fd3c2; --p2: #f2b56b; } }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--fg); }
  body { display: flex; flex-direction: column; justify-content: flex-end; }
  [hidden] { display: none !important; }
  .card { margin: 12px 16px 20px; padding: 12px 14px; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 0 12px; align-items: start; position: relative;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 22px rgba(0,0,0,.28); cursor: pointer;
    opacity: 0; transform: translateY(110%); transition: opacity .38s cubic-bezier(.215,.61,.355,1), transform .38s cubic-bezier(.215,.61,.355,1); }
  .card.shown { opacity: 1; transform: none; }
  .card.leaving { transition-duration: .22s; transition-timing-function: cubic-bezier(.55,.055,.675,.19); }
  img { width: 36px; height: 36px; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title.accent { color: var(--accent); } .title.error { color: var(--error); }
  .message { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 12px; }
  .sub:empty { display: none; }
  /* a chat's messages as they came: one person's in a row as one run, the author over it in a group, the time under it */
  .talk { display: grid; gap: 6px; margin-top: 4px; max-height: 196px; overflow-y: auto; overscroll-behavior: contain; }
  .run { display: grid; gap: 2px; justify-items: start; min-width: 0; }
  .run .who { font-size: 12px; font-weight: 600; color: var(--accent); }
  .run .who.p1 { color: var(--p1); } .run .who.p2 { color: var(--p2); }
  .bubble { background: var(--btn); border-radius: 10px 10px 10px 3px; padding: 4px 9px; max-width: 100%; box-sizing: border-box; overflow-wrap: anywhere; }
  .run .bubble:not(:last-of-type) { border-radius: 10px; }
  .bubble.me { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); } /* the one that mentions the user */
  .run time { color: var(--muted); font-size: 11px; }
  @media (prefers-reduced-motion: no-preference) { .bubble.fresh { animation: fresh 1.4s ease-out; } }
  @keyframes fresh { from { background: color-mix(in srgb, var(--accent) 26%, transparent); } }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .hint.error { color: var(--error); }
  .hint:empty, .actions:empty { display: none; }
  .actions { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  button { font: inherit; font-size: 13px; border: 0; border-radius: 6px; color: var(--fg); cursor: pointer; }
  .actions button, .main, .more > button { padding: 4px 10px; background: var(--btn); }
  .actions button:first-child, .main { background: var(--accent); color: var(--on-accent); }
  .actions button:hover, .more > button:hover { background: var(--btn-hover); }
  .actions button:first-child:hover, .main:hover { filter: brightness(1.1); background: var(--accent); }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .close { background: transparent; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 2px; margin: -4px -6px 0 0; }
  .close:hover { color: var(--fg); }
  /* a message card: "Reply", Teams' three quick reactions and "⋯" in one row; "Reply" opens the field above it */
  .row { grid-column: 2 / 4; display: flex; gap: 4px; margin-top: 10px; align-items: center; }
  .row .main { margin-right: 6px; }
  .emoji { background: transparent; font-size: 16px; padding: 3px 5px; line-height: 0; }
  /* Teams' own pictures of its quick reactions, as in its hover bar: its strip of animation frames, cut to the first 20 px one.
     On hover the icon grows and the strip plays at 24 frames a second, 5 times over, then rests on the first frame, as in Teams. */
  .emoji span { display: inline-block; width: 20px; height: 20px; overflow: hidden; }
  .emoji img { display: block; width: 20px; height: auto; }
  .emoji:hover span { transform: scale(1.2); }
  @media (prefers-reduced-motion: no-preference) { .emoji:hover img { animation: frames calc(var(--frames) * 1s / 24) steps(var(--frames)) 5; } }
  @keyframes frames { to { transform: translateY(-100%); } }
  .emoji:hover { background: var(--btn-hover); }
  .more { margin-left: auto; position: relative; }
  .menu { position: absolute; right: 0; bottom: calc(100% + 6px); display: grid; min-width: 210px; padding: 4px; z-index: 1;
    background: var(--menu); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .menu button { background: transparent; text-align: left; padding: 6px 10px; white-space: nowrap; }
  .menu button:hover { background: var(--btn-hover); }
  .reply { grid-column: 2 / 4; display: flex; gap: 6px; margin-top: 10px; cursor: default; }
  .reply input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--accent); border-radius: 6px; background: var(--field); color: var(--fg); }
  /* quick replies under the field: a click puts one into it */
  .quick { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; cursor: default; }
  .quick button { font-size: 12px; padding: 2px 9px; border-radius: 10px; background: var(--btn); }
  .quick button:hover { background: var(--btn-hover); }
  .tool { width: 30px; background: var(--btn); font-size: 14px; }
  .tool:hover { background: var(--btn-hover); }
  .send { width: 32px; background: var(--accent); color: var(--on-accent); }
  /* the AI writing or the message going out: the button turns into a spinning ring */
  .spin { color: transparent; position: relative; }
  .spin::after { content: ''; position: absolute; inset: 0; margin: auto; width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box;
    border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  .send.spin::after { border-color: color-mix(in srgb, var(--on-accent) 30%, transparent); border-top-color: var(--on-accent); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin::after { animation-duration: 3s; } }
</style>
</head>
<body>
  <div class="card" id="card">
    <img id="icon" alt="">
    <div><div class="title" id="title"></div><div class="sub" id="sub"></div><div class="message" id="message"></div><div class="talk" id="talk" hidden></div><div class="hint" id="hint"></div></div>
    <button class="close" id="close">✕</button>
    <div class="actions" id="actions"></div>
    <div class="reply" id="reply" hidden>
      <input id="field" data-i18n-placeholder="card.field">
      <button class="tool" id="ai" data-i18n-title="card.ai">✨</button>
      <button class="send" id="send" data-i18n-title="card.send">➤</button>
    </div>
    <div class="quick" id="quick" hidden></div>
    <div class="row" id="row" hidden>
      <button class="main" id="open" data-i18n="act.reply"></button>
      <button class="emoji" data-react="yes"><span><img alt="👍"></span></button><button class="emoji" data-react="heart"><span><img alt="❤️"></span></button><button class="emoji" data-react="laugh"><span><img alt="😆"></span></button>
      <span class="more"><button id="more" data-i18n-title="card.more">⋯</button>
        <span class="menu" id="menu" hidden><button id="m-react" data-i18n="card.reactions"></button><span id="m-actions"></span><button id="m-later" data-i18n="card.later"></button></span></span>
    </div>
  </div>
<script src="i18n.js"></script>
<script>
  // Texts come from Teams: textContent only.
  const $ = id => document.getElementById(id);
  const card = $('card');
  let life = 4000, timer, leaving, n = null, replying = false, variants = [], next = 0, keys = false, sending = false, idle;
  // life 0: a question to the user, the card waits for the answer
  const arm = () => { clearTimeout(timer); if (!replying && life) timer = setTimeout(leave, life); };
  // A card left with the reply field open: after 2 minutes without a key, what is typed waits in "Replies" and the card goes,
  // so the cards after it come.
  const stillHere = () => { clearTimeout(idle); if (replying) idle = setTimeout(() => { const v = $('field').value.trim(); if (v) bridge.invoke('draft:keep', n, v); leave(); }, 120_000); };
  function leave() {
    clearTimeout(timer);
    card.classList.add('leaving'); card.classList.remove('shown');
    leaving = setTimeout(() => bridge.invoke('toast:hidden'), 230);
  }
  const act = i => { clearTimeout(timer); card.classList.remove('shown'); bridge.invoke('toast:click', i); }; // -1 = the card itself
  // the window fits the card, and the open menu above it
  const fit = () => bridge.invoke('toast:size', card.offsetHeight + 32 + ($('menu').hidden ? 0 : $('menu').offsetHeight + 6));
  const say = (text, error) => { $('hint').textContent = text; $('hint').classList.toggle('error', !!error); return fit(); };
  const failed = e => String(e.message || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, '');
  const busy = on => { for (const b of card.querySelectorAll('.row button, .reply button')) b.disabled = on; };
  // A chat's card gathers its messages as they come (one person's in a row as one run, the author over it in a group);
  // a single message of a direct chat stays the plain text it always was. fresh: how many at the end just came.
  function showMsgs(msgs, fresh = 0) {
    const many = msgs.length > 1 || !!msgs[0]?.who;
    $('talk').hidden = !many; $('message').hidden = many;
    $('sub').textContent = msgs.length > 1 ? plural(msgs.length) : '';
    if (!many) return;
    const runs = [], people = [];
    for (const m of msgs) { const r = runs.at(-1); if (r && r.who === m.who) r.items.push(m); else runs.push({ who: m.who, items: [m] }); }
    $('talk').replaceChildren(...runs.map(r => {
      const run = document.createElement('div');
      run.className = 'run';
      if (r.who) {
        const w = document.createElement('span');
        const i = people.includes(r.who) ? people.indexOf(r.who) : people.push(r.who) - 1;
        w.className = `who${i % 3 ? ` p${i % 3}` : ''}`;
        w.textContent = r.who;
        run.append(w);
      }
      for (const m of r.items) {
        const b = document.createElement('div');
        b.className = 'bubble' + (m.me ? ' me' : '');
        b.textContent = m.text;
        run.append(b);
      }
      const time = document.createElement('time');
      time.textContent = r.items.at(-1).time;
      run.append(time);
      return run;
    }));
    const bubbles = $('talk').querySelectorAll('.bubble');
    for (let i = Math.max(0, bubbles.length - fresh); i < bubbles.length; i++) bubbles[i].classList.add('fresh');
    $('talk').scrollTop = $('talk').scrollHeight; // the newest in view
  }

  bridge.on('toast', async t => {
    await i18n;
    clearTimeout(leaving);
    $('icon').src = t.icon;
    $('title').textContent = t.title; $('title').className = 'title ' + (t.tone || '');
    $('message').textContent = t.message || '';
    showMsgs(t.reply?.msgs ?? []);
    say(t.hint || '');
    $('close').title = t.closeLabel;
    n = t.reply?.n ?? null; variants = t.reply?.variants ?? []; next = 0; replying = false; keys = false; sending = false; clearTimeout(idle);
    $('row').hidden = !n; $('reply').hidden = $('quick').hidden = true; $('menu').hidden = true; $('open').hidden = false; $('field').value = '';
    for (const b of document.querySelectorAll('[data-react]')) b.hidden = false;
    $('ai').hidden = !t.reply?.ai;
    $('quick').replaceChildren(...(t.reply?.quick ?? []).map(q => {
      const b = document.createElement('button');
      b.textContent = q;
      b.onclick = e => { e.stopPropagation(); $('field').value = q; engage(); };
      return b;
    }));
    const buttons = t.actions.map((label, i) => { // a message card puts them in its "⋯" menu
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = e => { e.stopPropagation(); act(i); };
      return b;
    });
    (n ? $('m-actions') : $('actions')).replaceChildren(...buttons);
    if (n) $('actions').replaceChildren();
    life = t.life;
    card.classList.remove('shown', 'leaving');
    requestAnimationFrame(async () => {
      await fit(); // + margins left for the shadow; the slide transform doesn't count
      requestAnimationFrame(() => card.classList.add('shown'));
      arm();
    });
  });

  // ---- a message card ----
  $('open').onclick = e => { e.stopPropagation(); openField(true); };
  // The field opens in the card. stay ("Reply"): it takes the keyboard and the card waits, however long the user types.
  // After a quick reaction it only shows: the keyboard stays where the user is typing until they click into the field.
  async function openField(stay) {
    clearTimeout(timer);
    $('open').hidden = true; $('reply').hidden = false; $('quick').hidden = !$('quick').children.length;
    if (variants.length && !$('field').value) $('field').value = variants[next++ % variants.length]; // already made: drafts mode
    await fit();
    if (stay) await engage(); else arm();
  }
  // The user turns to the card: it takes the keyboard (once) and stays.
  async function engage() {
    replying = true; clearTimeout(timer); stillHere();
    if (!keys) { keys = true; await bridge.invoke('toast:focus'); }
    $('field').focus();
  }
  $('field').onpointerdown = () => { if (!keys) engage(); };
  $('field').oninput = () => { replying = true; clearTimeout(timer); stillHere(); }; // typing: the card stays
  // ✨: the AI's variant into the field, to edit before sending; again: the next one. Text of the user's own in the field is what
  // the reply must say: the AI writes the variants after it.
  $('ai').onclick = async e => {
    e.stopPropagation();
    engage();
    const typed = $('field').value.trim(), hint = typed && !variants.includes(typed) ? typed : '';
    if (!variants.length || hint) {
      busy(true); $('ai').classList.add('spin'); say(t('card.thinking'));
      try {
        const d = await bridge.invoke('draft:suggest', n, hint);
        variants = d.variants; next = 0;
        say(d.error || '', !!d.error);
      } catch (err) { say(failed(err), true); }
      finally { busy(false); $('ai').classList.remove('spin'); }
    }
    if (variants.length) $('field').value = variants[next++ % variants.length];
    $('field').focus();
  };
  // The chat's next message, while its card is up: into the card, and the card stays on for it (not under the mouse or
  // the reply field: those keep it anyway). The variants were for fewer messages: ✨ makes new ones.
  bridge.on('toast:msgs', v => {
    if (v.n !== n) return;
    clearTimeout(leaving); card.classList.remove('leaving'); card.classList.add('shown'); // it was just going: it stays
    showMsgs(v.msgs, 1); // one message at a time
    variants = []; next = 0;
    fit();
    if (!replying && $('menu').hidden && !card.matches(':hover')) arm();
  });
  // drafts mode: the variants the app was still making when the card came
  bridge.on('toast:variants', v => {
    if (v.n !== n) return;
    variants = v.variants; next = 0;
    say(v.error || t('toast.replyReady'), !!v.error);
    if (!$('reply').hidden && !$('field').value && variants.length) $('field').value = variants[next++];
  });
  async function send() { // once: a second Enter while it goes out does nothing
    const text = $('field').value.trim();
    if (sending) return;
    if (!text) return $('field').focus();
    sending = true; busy(true); $('send').classList.add('spin'); say(t('card.sending'));
    try { await bridge.invoke('draft:send', n, text, false); leave(); }
    catch (err) { sending = false; busy(false); $('send').classList.remove('spin'); say(failed(err), true); }
  }
  $('send').onclick = e => { e.stopPropagation(); send(); };
  $('field').onkeydown = e => {
    if (e.key === 'Enter') send();
    if (e.key === 'Escape') { replying = false; clearTimeout(idle); $('reply').hidden = $('quick').hidden = true; $('open').hidden = false; $('field').value = ''; fit(); arm(); }
  };
  $('reply').onclick = $('quick').onclick = e => e.stopPropagation(); // clicks in the field are not "open the chat"
  for (const img of document.querySelectorAll('[data-react] img')) { // Teams' animated picture by the reaction's id; offline, the font's glyph
    img.onerror = () => img.parentElement.replaceWith(img.alt);
    img.onload = () => img.style.setProperty('--frames', img.naturalHeight / img.naturalWidth); // square frames, one under another
    img.src = `https://teams.public.onecdn.static.microsoft/evergreen-assets/personal-expressions/v2/assets/emoticons/${img.closest('[data-react]').dataset.react}/default/30_anim_f.png`;
  }
  // Teams' quick reactions, on the other side's latest message. The card stays with the reply field open, in case there
  // is something to say too; it goes on its own if the user does not start typing.
  for (const b of document.querySelectorAll('[data-react]')) b.onclick = async e => {
    e.stopPropagation();
    busy(true);
    try {
      await bridge.invoke('react:pick', n, b.dataset.react, 1, true); // true: no second card saying it
      busy(false);
      for (const x of document.querySelectorAll('[data-react]')) x.hidden = true; // a second click would take it off in Teams
      life = Math.max(life, 10_000);
      say(t('card.reacted', { emoji: b.querySelector('img')?.alt || b.textContent })); // offline the picture is the glyph itself
      openField(false);
    } catch (err) { busy(false); say(failed(err), true); }
  };
  $('more').onclick = e => { e.stopPropagation(); $('menu').hidden = !$('menu').hidden; clearTimeout(timer); fit(); };
  $('m-react').onclick = e => { e.stopPropagation(); bridge.invoke('react:open', n); leave(); };
  $('m-later').onclick = e => { e.stopPropagation(); bridge.invoke('draft:snooze', n, 60); leave(); };

  card.onmouseenter = () => clearTimeout(timer); // the user is reading or reaching for it
  card.onmouseleave = () => { if ($('menu').hidden) arm(); };
  card.onclick = () => act(-1);
  $('close').onclick = e => { e.stopPropagation(); leave(); };
</script>
</body>
</html>
