<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Soroka</title>
<style>
  /* A card in the corner above the clock: slides up, lives a few seconds, stays while the mouse is on it. */
  :root { color-scheme: light dark; --card: #ffffff; --fg: #1d1d1b; --muted: #616161; --line: rgba(0,0,0,.08); --accent: #5b5fc7; --error: #c4314b; --btn: rgba(0,0,0,.05); --btn-hover: rgba(0,0,0,.1); }
  @media (prefers-color-scheme: dark) { :root { --card: #2b2b2b; --fg: #f3f3f3; --muted: #b3b3b3; --line: rgba(255,255,255,.08); --accent: #9ea2ff; --error: #ff8a9e; --btn: rgba(255,255,255,.07); --btn-hover: rgba(255,255,255,.13); } }
  html, body { margin: 0; background: transparent; overflow: hidden; font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--fg); }
  .card { margin: 12px 16px 20px; padding: 12px 14px; display: grid; grid-template-columns: 36px 1fr auto; gap: 0 12px; align-items: start;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 22px rgba(0,0,0,.28); cursor: pointer;
    opacity: 0; transform: translateY(110%); transition: opacity .38s cubic-bezier(.215,.61,.355,1), transform .38s cubic-bezier(.215,.61,.355,1); }
  .card.shown { opacity: 1; transform: none; }
  .card.leaving { transition-duration: .22s; transition-timing-function: cubic-bezier(.55,.055,.675,.19); }
  img { width: 36px; height: 36px; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title.accent { color: var(--accent); } .title.error { color: var(--error); }
  .message { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .hint:empty, .actions:empty { display: none; }
  .actions { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .actions button { font: inherit; font-size: 13px; padding: 4px 10px; border: 0; border-radius: 6px; background: var(--btn); color: var(--fg); cursor: pointer; }
  .actions button:first-child { background: var(--accent); color: #fff; }
  .actions button:hover { background: var(--btn-hover); } .actions button:first-child:hover { filter: brightness(1.1); background: var(--accent); }
  .close { border: 0; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 2px; margin: -4px -6px 0 0; cursor: pointer; }
  .close:hover { color: var(--fg); }
</style>
</head>
<body>
  <div class="card" id="card">
    <img id="icon" alt="">
    <div><div class="title" id="title"></div><div class="message" id="message"></div><div class="hint" id="hint"></div></div>
    <button class="close" id="close">✕</button>
    <div class="actions" id="actions"></div>
  </div>
<script>
  // Texts come from Teams: textContent only.
  const card = document.getElementById('card');
  let life = 4000, timer, leaving;
  const arm = () => { clearTimeout(timer); timer = setTimeout(leave, life); };
  function leave() {
    clearTimeout(timer);
    card.classList.add('leaving'); card.classList.remove('shown');
    leaving = setTimeout(() => bridge.invoke('toast:hidden'), 230);
  }
  const act = i => { clearTimeout(timer); card.classList.remove('shown'); bridge.invoke('toast:click', i); }; // -1 = the card itself
  bridge.on('toast', t => {
    clearTimeout(leaving);
    document.getElementById('icon').src = t.icon;
    const title = document.getElementById('title');
    title.textContent = t.title; title.className = 'title ' + (t.tone || '');
    document.getElementById('message').textContent = t.message || '';
    document.getElementById('hint').textContent = t.hint || '';
    document.getElementById('close').title = t.closeLabel;
    document.getElementById('actions').replaceChildren(...t.actions.map((label, i) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = e => { e.stopPropagation(); act(i); };
      return b;
    }));
    life = t.life;
    card.classList.remove('shown', 'leaving');
    requestAnimationFrame(async () => {
      await bridge.invoke('toast:size', card.offsetHeight + 32); // + margins left for the shadow; the slide transform doesn't count
      requestAnimationFrame(() => card.classList.add('shown'));
      arm();
    });
  });
  card.onmouseenter = () => clearTimeout(timer); // the user is reading or reaching for it
  card.onmouseleave = arm;
  card.onclick = () => act(-1);
  document.getElementById('close').onclick = e => { e.stopPropagation(); leave(); };
</script>
</body>
</html>
