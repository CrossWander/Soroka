<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title data-i18n="share.title">Soroka</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --card: #fff; --fg: #1d1d1b; --muted: #6b6b66; --line: #deded8; --accent: #5b5fc7; --on: #fff; --hover: #ececf8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1f1e; --card: #2a2a29; --fg: #ececea; --muted: #a0a09a; --line: #3d3d3b; --accent: #8f95ff; --on: #1f1f1e; --hover: #34344a; } }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  main { flex: 1; overflow-y: auto; padding: 4px 16px 8px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .tile { display: flex; flex-direction: column; gap: 6px; padding: 6px; border: 2px solid transparent; border-radius: 8px; background: var(--card); color: inherit; font: inherit; text-align: left; cursor: pointer; min-width: 0; }
  .tile:hover { background: var(--hover); }
  .tile[aria-pressed="true"] { border-color: var(--accent); }
  .tile img { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; border-radius: 4px; }
  .tile span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
  footer button { font: inherit; padding: 5px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  footer button.primary { background: var(--accent); border-color: var(--accent); color: var(--on); font-weight: 600; }
  footer button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
</head>
<body>
  <main id="list"></main>
  <footer><button id="cancel" data-i18n="share.cancel"></button><button id="go" class="primary" data-i18n="share.go" disabled></button></footer>
<script src="i18n.js"></script>
<script type="module">
  // The screens and windows the call can show, as pictures; the one chosen goes to Teams, nothing goes without a click
  await i18n;
  const $ = id => document.getElementById(id);
  const sources = await bridge.invoke('share:sources');
  let chosen = '';
  const choose = (id, tile) => { chosen = id; for (const x of document.querySelectorAll('.tile')) x.setAttribute('aria-pressed', String(x === tile)); $('go').disabled = false; };
  const go = () => { if (chosen) bridge.invoke('share:pick', chosen); };
  const tile = s => {
    const b = Object.assign(document.createElement('button'), { className: 'tile', title: s.name, onclick: () => choose(s.id, b), ondblclick: go });
    b.dataset.id = s.id;
    b.append(Object.assign(new Image(), { src: s.thumb, alt: '' }), Object.assign(document.createElement('span'), { textContent: s.name }));
    return b;
  };
  const screens = sources.filter(s => s.screen), windows = sources.filter(s => !s.screen);
  screens.forEach((s, i) => (s.name = screens.length > 1 ? t('share.screenN', { n: i + 1 }) : t('share.screen')));
  for (const [key, list] of [['share.screens', screens], ['share.windows', windows]]) if (list.length) {
    const grid = Object.assign(document.createElement('div'), { className: 'grid' });
    grid.append(...list.map(tile));
    $('list').append(Object.assign(document.createElement('h2'), { textContent: t(key) }), grid);
  }
  const first = document.querySelector('.tile'); // the (first) whole screen, as most often shown
  if (first) { choose(first.dataset.id, first); first.focus(); }
  $('go').onclick = go;
  $('cancel').onclick = () => window.close();
  addEventListener('keydown', e => { if (e.key === 'Escape') window.close(); });
</script>
</body>
</html>
