<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Soroka</title>
<style>
  /* The call's compact view in the look of the app's cards (call.html, toast.html): who speaks, the meeting, how many are in
     and how long, then Teams' own buttons, red when off, and a wide red Leave. "—" folds it to the buttons alone, with a
     handle to drag it; the arrow there brings the card back. The window is transparent: the page draws the card with its
     shadow and asks for its size (mini:size). */
  :root { color-scheme: light dark; --card: #ffffff; --fg: #1d1d1b; --muted: #616161; --line: rgba(0,0,0,.08); --accent: #5b5fc7; --btn: rgba(0,0,0,.05); --btn-hover: rgba(0,0,0,.1);
    --off: #c4314b; --no: #c4314b; }
  @media (prefers-color-scheme: dark) { :root { --card: #2b2b2b; --fg: #f3f3f3; --muted: #b3b3b3; --line: rgba(255,255,255,.08); --accent: #9ea2ff; --btn: rgba(255,255,255,.07);
    --btn-hover: rgba(255,255,255,.13); --off: #e37d80; } }
  html, body { margin: 0; background: transparent; overflow: hidden; font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--fg); user-select: none; }
  [hidden] { display: none !important; }
  #box { width: max-content; padding: 8px 12px 16px; } /* room for the shadow */
  .card, .bar { background: var(--card); border: 1px solid var(--line); box-shadow: 0 6px 16px rgba(0,0,0,.28); app-region: drag; }
  button { all: unset; app-region: no-drag; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; color: inherit; border-radius: 6px; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.f { fill: currentColor; stroke: none; }
  .slash { display: none; }
  .off .slash { display: inline; }
  .off { color: var(--off); }
  .on { color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent) !important; }

  .card { width: 336px; box-sizing: border-box; border-radius: 8px; padding: 14px; display: grid; gap: 12px; position: relative; }
  .corner { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; }
  .corner button { padding: 3px; color: var(--muted); border-radius: 4px; }
  .corner button:hover { color: var(--fg); background: var(--btn); }
  .corner svg.i { width: 16px; height: 16px; }
  .head { display: flex; gap: 12px; align-items: center; padding-right: 52px; min-width: 0; }
  .avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 15px;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .speaking .avatar { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
  .lines { min-width: 0; }
  .kind { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .name { font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dots { display: inline-flex; align-items: center; gap: 2px; height: 12px; flex: none; }
  .dots i { width: 3px; height: 8px; border-radius: 2px; background: var(--accent); animation: talk .9s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes talk { 0%, 100% { height: 5px; } 50% { height: 12px; } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; } }
  .btns { display: flex; gap: 8px; }
  .btns button { height: 34px; padding: 0 10px; background: var(--btn); font-weight: 600; font-size: 13px; }
  .btns button:hover { background: var(--btn-hover); }
  .leave, .bar .end { background: var(--no) !important; color: #fff; }
  .leave:hover, .bar .end:hover { filter: brightness(1.1); }
  .btns .leave { flex: 1; }
  .btns .leave svg.i { width: 18px; height: 18px; }

  .bar { width: max-content; display: flex; align-items: center; gap: 2px; padding: 6px 8px 6px 4px; border-radius: 12px; }
  .grip { width: 14px; height: 24px; display: grid; grid-template-columns: repeat(2, 3px); gap: 3px; align-content: center; justify-content: center; margin-right: 4px; }
  .grip i { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); }
  .bar button { width: 36px; height: 36px; border-radius: 8px; }
  .bar button:hover { background: var(--btn); }
  .bar .end { width: 44px; margin-left: 4px; }
  .bar .unfold svg.i { width: 16px; height: 16px; color: var(--muted); }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2.75" width="6" height="11.5" rx="3"/><path d="M5.75 11.25a6.25 6.25 0 0 0 12.5 0M12 17.5v3.75"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="2.75" y="6.25" width="13" height="11.5" rx="2.5"/><path d="M15.75 10.25l4.4-2.6a.7.7 0 0 1 1.1.6v7.5a.7.7 0 0 1-1.1.6l-4.4-2.6"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V6.5a1.25 1.25 0 0 1 2.5 0V12M10.5 11.5V4.75a1.25 1.25 0 0 1 2.5 0v6.75M13 11.5V5.75a1.25 1.25 0 0 1 2.5 0v6.75M15.5 12.5V8.75a1.25 1.25 0 0 1 2.5 0V14a7 7 0 0 1-7 7h-.5a6 6 0 0 1-4.9-2.6L3.9 15.3a1.3 1.3 0 0 1 2-1.6L8 16"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.75"/><path d="M4.75 20.25c0-3.4 3.2-5.75 7.25-5.75s7.25 2.35 7.25 5.75"/></symbol>
    <symbol id="i-end" viewBox="0 0 24 24"><path d="M2.6 13.1c5.2-5 13.6-5 18.8 0 .5.5.5 1.2.1 1.7l-1.6 1.9c-.4.5-1.1.6-1.6.3l-2.6-1.4c-.4-.2-.6-.7-.6-1.1v-1.8a11.6 11.6 0 0 0-5.8 0v1.8c0 .5-.2.9-.6 1.1l-2.6 1.4c-.5.3-1.2.2-1.6-.3l-1.6-1.9c-.4-.5-.4-1.2.1-1.7z"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M10 4.75H6.75a2 2 0 0 0-2 2v10.5a2 2 0 0 0 2 2h10.5a2 2 0 0 0 2-2V14M14 4.75h5.25V10M19.25 4.75L12 12"/></symbol>
    <symbol id="i-fold" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-unfold" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
  </svg>
  <div id="box">
    <div class="card" id="card">
      <div class="corner">
        <button data-act="fold" data-i18n-title="mini.fold" data-i18n-aria="mini.fold"><svg class="i"><use href="#i-fold"/></svg></button>
        <button data-act="expand" data-i18n-title="mini.expand" data-i18n-aria="mini.expand"><svg class="i"><use href="#i-expand"/></svg></button>
      </div>
      <div class="head">
        <div class="avatar" id="avatar"></div>
        <div class="lines"><div class="kind" id="kind"></div><div class="name"><span class="dots" id="dots" hidden><i></i><i></i><i></i></span><span id="who"></span></div></div>
      </div>
      <div class="btns">
        <button data-act="mic" data-i18n-title="mini.mic" data-i18n-aria="mini.mic"><svg class="i"><use href="#i-mic"/><path class="slash" d="M3.5 3.5l17 17"/></svg></button>
        <button data-act="video" data-i18n-title="mini.video" data-i18n-aria="mini.video"><svg class="i"><use href="#i-video"/><path class="slash" d="M3.5 3.5l17 17"/></svg></button>
        <button data-act="hand" data-i18n-title="mini.hand" data-i18n-aria="mini.hand"><svg class="i"><use href="#i-hand"/></svg></button>
        <button data-act="roster" data-i18n-title="mini.people" data-i18n-aria="mini.people"><svg class="i"><use href="#i-people"/></svg><span id="count"></span></button>
        <button class="leave" data-act="leave"><svg class="i f"><use href="#i-end"/></svg><span data-i18n="mini.leave"></span></button>
      </div>
    </div>
    <div class="bar" id="bar" hidden>
      <span class="grip" data-i18n-title="mini.drag"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <button data-act="mic" data-i18n-title="mini.mic" data-i18n-aria="mini.mic"><svg class="i"><use href="#i-mic"/><path class="slash" d="M3.5 3.5l17 17"/></svg></button>
      <button data-act="video" data-i18n-title="mini.video" data-i18n-aria="mini.video"><svg class="i"><use href="#i-video"/><path class="slash" d="M3.5 3.5l17 17"/></svg></button>
      <button data-act="hand" data-i18n-title="mini.hand" data-i18n-aria="mini.hand"><svg class="i"><use href="#i-hand"/></svg></button>
      <button class="end" data-act="leave" data-i18n-title="mini.leave" data-i18n-aria="mini.leave"><svg class="i f"><use href="#i-end"/></svg></button>
      <button class="unfold" data-act="unfold" data-i18n-title="mini.unfold" data-i18n-aria="mini.unfold"><svg class="i"><use href="#i-unfold"/></svg></button>
    </div>
  </div>
<script src="i18n.js"></script>
<script type="module">
  // Names come from Teams: textContent and titles only.
  await i18n;
  const $ = id => document.getElementById(id), all = act => [...document.querySelectorAll(`[data-act="${act}"]`)];
  let size = '', view = null, since = 0;
  const fit = () => {
    const r = $('box').getBoundingClientRect(), w = Math.ceil(r.width), h = Math.ceil(r.height);
    if (`${w}x${h}` !== size) { size = `${w}x${h}`; void bridge.invoke('mini:size', w, h); }
  };
  const fold = folded => { $('card').hidden = folded; $('bar').hidden = !folded; fit(); };
  for (const b of document.querySelectorAll('[data-act]')) b.onclick = () => {
    const act = b.dataset.act;
    if (act === 'fold' || act === 'unfold') fold(act === 'fold');
    bridge.invoke('mini:act', act).catch(() => {});
  };
  const people = n => t(`mini.n.${new Intl.PluralRules(document.documentElement.lang).select(n)}`, { n });
  const clock = () => {
    if (!since) return '';
    const s = Math.max(0, Math.floor((Date.now() - since) / 1000)), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, two = x => String(x).padStart(2, '0');
    return h ? `${h}:${two(m)}:${two(s % 60)}` : `${m}:${two(s % 60)}`;
  };
  const initials = name => name.split(/\s+/).filter(w => /^\p{L}/u.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join('');
  // who speaks on the second line; nobody seen speaking: the meeting there, and the first line without it
  const draw = () => {
    if (!view) return;
    const v = view, parts = v.speaker ? [v.title] : [];
    if (v.count) parts.push(people(v.count));
    parts.push(clock());
    $('kind').textContent = $('kind').title = parts.filter(Boolean).join(' · ');
    $('who').textContent = $('who').title = v.speaker || v.title;
    $('dots').hidden = !v.speaker;
    $('card').classList.toggle('speaking', !!v.speaker);
    $('avatar').textContent = initials(v.speaker || v.title) || '📞';
  };
  bridge.on('mini', v => {
    if (!view) { since = v.since; fold(v.folded); } // later the page's own folding counts: a look may be on its way already
    view = v;
    for (const b of all('mic')) b.classList.toggle('off', v.mic === false); // null: not known, drawn as on
    for (const b of all('video')) b.classList.toggle('off', v.video === false);
    for (const b of all('hand')) b.classList.toggle('on', v.hand === true);
    $('count').textContent = v.count ? String(v.count) : '';
    draw();
    fit();
  });
  setInterval(draw, 1000); // the call's time
  fit(); // shown at once, filled when the call's page answers
</script>
</body>
</html>
