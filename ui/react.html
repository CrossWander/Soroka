<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https://teams.public.onecdn.static.microsoft; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title data-i18n="react.window">Soroka</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --card: #fff; --fg: #1d1d1b; --muted: #6b6b66; --line: #deded8; --accent: #5b5fc7; --error: #c4314b; --hover: #ececf8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1f1e; --card: #2a2a29; --fg: #ececea; --muted: #a0a09a; --line: #3d3d3b; --accent: #8f95ff; --error: #ff8a9e; --hover: #34344a; } }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; border: 1px solid var(--line); box-sizing: border-box; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 6px 4px 12px; -webkit-app-region: drag; font-weight: 600; }
  .bar span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar button { -webkit-app-region: no-drag; }
  button { font: inherit; color: inherit; background: transparent; border: 0; border-radius: 6px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: .5; cursor: default; }
  .close { font-size: 18px; line-height: 1; padding: 2px 8px; color: var(--muted); }
  .emoji { font: 22px/1 "Segoe UI Emoji", "Segoe UI", sans-serif; width: 36px; height: 36px; padding: 0; }
  .emoji img { width: 28px; height: 28px; vertical-align: middle; }
  #tabs img { width: 20px; height: 20px; vertical-align: middle; }
  #quick { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 10px 6px; border-bottom: 1px solid var(--line); }
  #search { margin: 8px 10px 4px; font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  #tabs { display: flex; gap: 2px; padding: 0 10px 4px; }
  #tabs button { font: 17px/1 "Segoe UI Emoji", sans-serif; width: 34px; height: 30px; padding: 0; opacity: .6; }
  #tabs button.on { opacity: 1; box-shadow: inset 0 -2px var(--accent); }
  #grid { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 10px 8px; display: grid; grid-template-columns: repeat(auto-fill, 36px); grid-auto-rows: 36px; gap: 2px; align-content: start; }
  #status { min-height: 1.4em; padding: 4px 12px 8px; color: var(--muted); font-size: 12px; }
  #status.error { color: var(--error); }
</style>
</head>
<body>
  <div class="bar"><span id="head"></span><button class="close" data-i18n-title="toast.close">✕</button></div>
  <div id="quick"></div>
  <input id="search" data-i18n-placeholder="react.search">
  <div id="tabs"></div>
  <div id="grid"></div>
  <div id="status"></div>
<script src="i18n.js"></script>
<script src="reactions.js"></script>
<script type="module">
  // Teams' full set of reactions (reactions.js, taken from its picker); the one clicked goes on the other side's latest message.
  await i18n;
  const $ = id => document.getElementById(id);
  const n = new URLSearchParams(location.search).get('n');
  const { title, recent } = await bridge.invoke('react:get', n);
  $('head').textContent = t('react.title', { title });
  document.querySelector('.close').onclick = () => window.close();
  addEventListener('keydown', e => { if (e.key === 'Escape') window.close(); }); // like a menu
  const byId = new Map();
  for (const [, tab, items] of REACTIONS) for (const [id, glyph, label] of items) if (!byId.has(id)) byId.set(id, { id, glyph, label: document.documentElement.lang === 'ru' ? label : id.replace(/^[0-9a-f]+(_[0-9a-f]+)*_/, '').replace(/[-_]+/g, ' '), ru: label, tab }); // Teams' labels are Russian: in another language its id says it
  // Teams' quick reactions; its quick 👍 is the emoticon "yes" (the picker's "like" is another thumb)
  const QUICK = ['yes', 'heart', 'laugh', 'surprised', 'sad', 'angry'];
  // Teams' own picture of a reaction, by its id, so it looks as in Teams; offline, the font's glyph
  const picture = r => {
    const img = Object.assign(document.createElement('img'), { alt: r.glyph, loading: 'lazy',
      src: `https://teams.public.onecdn.static.microsoft/evergreen-assets/personal-expressions/v2/assets/emoticons/${r.id}/default/30_f.png` });
    img.onerror = () => img.replaceWith(r.glyph);
    return img;
  };
  let busy = false;
  const button = r => {
    const b = document.createElement('button'); b.className = 'emoji'; b.append(picture(r)); b.title = r.label;
    b.onclick = async () => {
      if (busy) return;
      busy = true; document.body.style.cursor = 'progress'; $('status').className = ''; $('status').textContent = t('react.busy');
      try { await bridge.invoke('react:pick', n, r.id, r.tab); } // the window closes on success
      catch (e) { $('status').className = 'error'; $('status').textContent = String(e.message || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, ''); }
      finally { busy = false; document.body.style.cursor = ''; }
    };
    return b;
  };
  $('quick').append(...[...new Set([...QUICK, ...recent])].map(id => byId.get(id)).filter(Boolean).slice(0, 18).map(button));
  // one category at a time: a few hundred buttons, not all 1600
  const show = i => {
    [...$('tabs').children].forEach((b, k) => b.classList.toggle('on', k === i));
    $('grid').replaceChildren(...REACTIONS[i][2].map(([id]) => byId.get(id)).filter(Boolean).map(button));
    $('grid').scrollTop = 0;
  };
  $('tabs').append(...REACTIONS.map(([cat, , items], i) => {
    const b = document.createElement('button'); b.append(picture(byId.get(items[0][0]))); b.title = t(`react.cat.${cat}`); b.onclick = () => { $('search').value = ''; show(i); };
    return b;
  }));
  // by Teams' label (in its language) or the reaction's id, which is English: "heart", "party"
  $('search').oninput = () => {
    const q = $('search').value.trim().toLowerCase();
    if (!q) return show(0);
    [...$('tabs').children].forEach(b => b.classList.remove('on'));
    $('grid').replaceChildren(...[...byId.values()].filter(r => r.ru.toLowerCase().includes(q) || r.id.includes(q)).slice(0, 300).map(button));
  };
  show(0);
  $('search').focus();
</script>
</body>
</html>
