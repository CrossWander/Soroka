<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title data-i18n="set.title">Soroka</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --card: #fff; --fg: #1d1d1b; --muted: #6b6b66; --line: #e3e3de; --accent: #5b5fc7; --ok: #107c10; --warn: #c4314b;
    --hover: rgba(0,0,0,.05); --sel: rgba(91,95,199,.10); --knob: #fff; --off: #8a8a85; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1f1e; --card: #2a2a29; --fg: #ececea; --muted: #a0a09a; --line: #3a3a38; --accent: #8f95ff; --ok: #6ccb5f; --warn: #ff8a9e;
    --hover: rgba(255,255,255,.07); --sel: rgba(143,149,255,.14); --knob: #1f1f1e; --off: #8f8f8a; } }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  /* as Teams' and Windows 11's own settings: the sections on the left, one of them on the right */
  .shell { height: 100%; display: flex; }
  nav { width: 220px; flex: none; box-sizing: border-box; padding: 14px 8px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  nav h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px 10px; }
  nav button { border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 6px; position: relative; }
  nav button:hover { background: var(--hover); }
  nav button[aria-current="true"] { background: var(--sel); font-weight: 600; }
  nav button[aria-current="true"]::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--accent); }
  .pane { flex: 1; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .inner { width: 100%; max-width: 700px; box-sizing: border-box; padding: 16px 22px 12px; flex: 1; }
  header { display: flex; align-items: center; margin-bottom: 10px; }
  h2 { font-size: 20px; font-weight: 600; margin: 0; }
  #close { margin-left: auto; border: 0; font-size: 15px; padding: 2px 8px; color: var(--muted); background: transparent; }
  #close:hover { color: var(--fg); background: var(--hover); }
  .welcome { border-left: 3px solid var(--accent); padding: 2px 10px; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .intro { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  /* a row: the name and one line of explanation on the left, the control on the right */
  .group { background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .group > * + *, #aiRows > * { border-top: 1px solid var(--line); }
  .group > #aiRows { border-top: 0; }
  .row { display: flex; align-items: center; gap: 16px; padding: 9px 14px; min-height: 42px; box-sizing: border-box; }
  .text, .row > .name { flex: 1; min-width: 0; }
  .text > span { display: block; }
  .note { color: var(--muted); font-size: 12px; }
  .group > .note { padding: 8px 14px; } /* under the rows: the AIs found, the self-check */
  .note:empty { display: none; }
  .note.warn { color: var(--warn); }
  .ctl { flex: none; display: flex; align-items: center; gap: 8px; max-width: 60%; min-width: 0; }
  .ctl > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } /* a state: its title has it whole */
  .row > .grow { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } /* an AI program's state */
  .row.tall { flex-wrap: wrap; }
  .row.tall .ctl { max-width: none; flex-basis: 100%; flex-wrap: wrap; justify-content: flex-end; }
  #aiOthers { display: flex; flex-wrap: wrap; gap: 2px 10px; justify-content: flex-end; white-space: normal; }
  select, button, textarea, input { font: inherit; color: var(--fg); }
  select, input:not([type="checkbox"]), textarea { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); min-width: 0; max-width: 100%; }
  input.wide { width: 260px; }
  [aria-invalid="true"] { border-color: var(--warn) !important; } /* turned down: the text stays to be fixed */
  textarea { width: 100%; box-sizing: border-box; height: 84px; resize: vertical; }
  textarea[name="quickReplies"] { height: 112px; } /* all five phrases in sight */
  button { padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: .5; cursor: default; }
  .link { border: 0; padding: 0; color: var(--accent); background: none; }
  .link:hover:not(:disabled) { background: none; text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* the switch of Teams and Windows 11 for an on/off setting */
  input[type="checkbox"] { appearance: none; width: 40px; height: 20px; flex: none; margin: 0; border-radius: 10px; border: 1px solid var(--off); position: relative; cursor: pointer; }
  input[type="checkbox"]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--off); transition: left .12s; }
  input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  input[type="checkbox"]:checked::after { left: 23px; background: var(--knob); }
  label.row { cursor: pointer; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }
  kbd { font: 12px "Segoe UI", system-ui; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--card); }
  footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 12px; padding: 8px 22px 14px; max-width: 700px; box-sizing: border-box; }
  [hidden] { display: none !important; }
  .spin { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } input[type="checkbox"]::after { transition: none; } }
  /* a narrow window: the sections above, the controls under their names */
  @media (max-width: 640px) {
    .shell { flex-direction: column; }
    nav { width: auto; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
    nav h1 { display: none; }
    nav button[aria-current="true"]::before { display: none; }
    .row { flex-wrap: wrap; }
    .ctl { max-width: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <nav id="nav"><h1 data-i18n="set.nav"></h1></nav>
  <div class="pane" id="pane">
    <div class="inner">
      <header><h2 id="secTitle"></h2><button id="close" data-i18n-title="toast.close">✕</button></header>
      <section data-sec="general" data-name="set.sec.general">
        <div class="welcome" id="welcome" data-i18n="set.welcome" hidden></div>
        <div class="group">
          <div class="row"><span class="text" data-i18n="set.language"></span>
            <span class="ctl"><select name="language"><option value="uk">Українська</option><option value="en">English</option><option value="ru">Русский</option></select></span></div>
          <div class="row"><span class="text"><span data-i18n="set.theme"></span><span class="note" data-i18n="set.themeNote"></span></span>
            <span class="ctl"><select name="theme"><option value="" data-i18n="set.themeSystem"></option><option value="light" data-i18n="set.themeLight"></option><option value="dark" data-i18n="set.themeDark"></option></select></span></div>
          <label class="row"><span class="text" data-i18n="set.autostart"></span><input type="checkbox" name="autostart"></label>
          <div class="row"><span class="text"><span data-i18n="set.links"></span><span class="note" data-i18n="set.linksNote"></span></span>
            <span class="ctl"><select name="links"><option value="" data-i18n="set.linksApp"></option><option value="browser" data-i18n="set.linksBrowser"></option></select></span></div>
          <label class="row"><span class="text"><span data-i18n="set.officeMenu"></span><span class="note" data-i18n="set.officeMenuNote"></span></span>
            <input type="checkbox" name="officeMenu"></label>
          <div class="row"><span class="text" data-i18n="set.jira"></span><span class="ctl"><input class="wide" name="jiraUrl" data-i18n-placeholder="set.jiraPh"></span></div>
          <!-- no name: the token goes only through jira:tokenSet, never with the settings, and is never shown back -->
          <div class="row"><span class="text"><span data-i18n="set.jiraToken"></span><span class="note" data-i18n="set.jiraTokenNote"></span><span class="note warn" id="jiraTokenWarn" hidden></span></span>
            <span class="ctl"><span id="jiraTokenState" hidden></span>
              <input type="password" id="jiraToken" autocomplete="off" spellcheck="false" maxlength="500" data-i18n-placeholder="set.jiraTokenPh">
              <button id="jiraTokenSave" data-i18n="set.jiraTokenSave"></button><button id="jiraTokenDelete" data-i18n="set.jiraTokenDelete" hidden></button></span></div>
          <div class="row"><span class="text" data-i18n="set.notify"></span><span class="ctl"><button id="notifyTest" data-i18n="set.notifyTest"></button></span></div>
        </div>
      </section>

      <section data-sec="notify" data-name="set.sec.notify">
        <p class="intro" data-i18n="set.notifyNote"></p>
        <div class="group">
          <div class="row"><span class="text" data-i18n="set.onlyFrom"></span><span class="ctl"><input class="wide" name="onlyFrom" maxlength="1000" data-i18n-placeholder="set.onlyFromPh"></span></div>
          <div class="row"><span class="text" data-i18n="set.keywords"></span><span class="ctl"><input class="wide" name="keywords" maxlength="1000" data-i18n-placeholder="set.keywordsPh"></span></div>
          <div class="row"><span class="text" data-i18n="set.muteFrom"></span><span class="ctl"><input class="wide" name="muteFrom" maxlength="1000" data-i18n-placeholder="set.muteFromPh"></span></div>
          <div class="row"><span class="text"><span data-i18n="set.quiet"></span><span class="note" data-i18n="set.quietNote"></span></span>
            <span class="ctl"><input type="time" name="quietFrom"> – <input type="time" name="quietTo"></span></div>
          <label class="row"><span class="text" data-i18n="set.quietDnd"></span><input type="checkbox" name="quietDnd"></label>
          <label class="row"><span class="text" data-i18n="set.activity"></span><input type="checkbox" name="activity"></label>
          <label class="row" data-ai><span class="text"><span data-i18n="set.triage"></span><span class="note" data-i18n="set.triageShort" data-i18n-title="set.triageNote"></span></span>
            <input type="checkbox" name="triage"></label>
        </div>
      </section>

      <section data-sec="remind" data-name="set.sec.remind">
        <div class="group">
          <div class="row"><span class="text"><span data-i18n="set.remindPersonal"></span><span class="note" data-i18n="set.remindNote"></span></span>
            <span class="ctl"><select name="remindAfter"><option value="" data-i18n="set.remindNever"></option><option value="60" data-i18n="set.remind60"></option>
              <option value="240" data-i18n="set.remind240"></option><option value="1440" data-i18n="set.remind1440"></option></select></span></div>
          <div class="row"><span class="text"><span data-i18n="set.followUp"></span><span class="note" data-i18n="set.followUpShort" data-i18n-title="set.followUpNote"></span></span>
            <span class="ctl"><select name="followUpAfter"><option value="" data-i18n="set.remindNever"></option><option value="60" data-i18n="set.remind60"></option>
              <option value="240" data-i18n="set.remind240"></option><option value="1440" data-i18n="set.remind1440"></option></select></span></div>
        </div>
      </section>

      <section data-sec="replies" data-name="set.sec.replies">
        <div class="group">
          <div class="row tall"><span class="text"><span data-i18n="set.quick"></span><span class="note" data-i18n="set.quickShort" data-i18n-title="set.quickNote"></span></span>
            <span class="ctl"><textarea name="quickReplies" maxlength="500" data-i18n-placeholder="quick.default"></textarea></span></div>
          <div class="row" data-ai><span class="text"><span data-i18n="set.action"></span><span class="note" id="modeNote"></span></span>
            <span class="ctl"><select name="wakeMode">
              <option value="notify" data-i18n="set.wake.notify"></option>
              <option value="drafts" data-i18n="set.wake.drafts"></option>
              <option value="monitor" data-i18n="set.wake.monitor"></option>
            </select></span></div>
          <div class="row" data-ai><span class="text" data-i18n="set.model"></span><span class="ctl"><select name="draftModel"></select></span></div>
          <div class="row tall" data-ai><span class="text"><span data-i18n="set.styleNote"></span><span class="note" id="styleNote"></span></span>
            <span class="ctl"><textarea id="style" maxlength="3000" data-i18n-placeholder="set.stylePlaceholder"></textarea><button class="link" id="styleLearn" data-i18n="set.styleLearn"></button></span></div>
          <div class="row tall" data-ai><span class="text"><span data-i18n="set.tones"></span><span class="note" data-i18n="set.tonesNote"></span></span>
            <span class="ctl"><textarea name="tones" maxlength="3000" data-i18n-placeholder="set.tonesPh"></textarea></span></div>
          <label class="row" data-ai><span class="text" data-i18n="set.label"></span><input type="checkbox" name="label"></label>
        </div>
      </section>

      <section data-sec="summary" data-name="set.sec.summary">
        <div class="group">
          <div class="row"><span class="text"><span data-i18n="set.digest"></span><span class="note" data-i18n="set.digestNote"></span></span>
            <span class="ctl"><input type="time" name="digestAt"></span></div>
          <label class="row"><span class="text" data-i18n="set.summaryBackground"></span><input type="checkbox" name="summaryBackground"></label>
          <div class="row" data-ai><span class="text" data-i18n="set.model"></span><span class="ctl"><select name="summaryModel"></select></span></div>
        </div>
      </section>

      <section data-sec="ai" data-name="set.sec.ai">
        <div class="group">
          <label class="row"><span class="text"><span data-i18n="set.aiOff"></span><span class="note" data-ai-off data-i18n="set.aiOffNote"></span></span>
            <input type="checkbox" name="aiOff"></label>
          <div id="aiRows" data-ai-on></div>
          <div class="row" data-ai-on><span class="text" data-i18n="set.aiOthers"></span><span class="ctl"><span id="aiOthers"></span></span></div>
          <div class="note" id="aiNote" data-ai-on></div>
          <div class="row" data-ai-on><span class="text"><span data-i18n="set.models"></span><span class="note" data-i18n="set.modelsShort" data-i18n-title="set.modelsNote"></span></span>
            <span class="ctl"><span id="modelsNote"></span><button id="modelsCheck" data-i18n="set.modelsCheck"></button></span></div>
          <div class="row" data-ai-on><span class="text"><span data-i18n="set.webChat"></span><span class="note" data-i18n="set.webNote"></span></span>
            <span class="ctl"><select name="webChat"><option value="" data-i18n="set.webAuto"></option><option value="claude">Claude</option><option value="chatgpt">ChatGPT</option>
              <option value="gemini">Gemini</option><option value="m365">Microsoft 365 Copilot</option><option value="github">GitHub Copilot</option></select></span></div>
          <div class="row" data-ai><span class="text"><span data-i18n="set.aiSkip"></span><span class="note" data-i18n="set.aiSkipShort" data-i18n-title="set.aiSkipNote"></span></span>
            <span class="ctl"><input class="wide" name="aiSkip" maxlength="1000" data-i18n-placeholder="set.aiSkipPh"></span></div>
        </div>
      </section>

      <section data-sec="teams" data-name="set.sec.teams">
        <div class="group">
          <div class="row"><span class="text">Teams</span><span class="ctl"><span id="teamsState"><span class="dot"></span>…</span><button id="teamsShow" data-i18n="set.open"></button></span></div>
          <div class="row"><span class="text" data-i18n="set.diag"></span><span class="ctl"><span id="diagState"><span class="dot"></span>…</span><button id="diagCheck" data-i18n="set.check"></button></span></div>
          <div class="note" id="diagNote"></div>
          <div class="row"><span class="text" data-i18n="set.keySummary"></span><span class="ctl"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>S</kbd></span></div>
          <div class="row" data-ai><span class="text" data-i18n="set.keyReply"></span><span class="ctl"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>R</kbd></span></div>
          <div class="row" data-ai><span class="text" data-i18n="set.keyImprove"></span><span class="ctl"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>I</kbd></span></div>
          <div class="row"><span class="text" data-i18n="set.keyRefresh"></span><span class="ctl"><kbd>F5</kbd></span></div>
          <div class="note" data-i18n="set.keysNote"></div>
        </div>
      </section>
    </div>
    <footer><span><span id="about">Soroka · created by Pavlo Dykalo</span> · <button class="link" id="diagCopy" data-i18n="set.diagCopy"></button></span><span id="status" data-i18n="set.footer"></span></footer>
  </div>
</div>
<script src="i18n.js"></script>
<script type="module">
  await i18n;
  const $ = id => document.getElementById(id);
  const errorText = e => String(e.message || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, '');
  const spin = () => Object.assign(document.createElement('span'), { className: 'spin' }); // the AI takes a while: show it is working
  $('welcome').hidden = !new URLSearchParams(location.search).has('welcome');
  let current = {}, models = {};
  // keep: a field whose value the user is still at (the one being typed in, or one the app turned down: fixed, not wiped)
  const show = (s, keep) => {
    current = s;
    document.querySelectorAll('[name]').forEach(el => {
      if (el === keep || (el === document.activeElement && el.type !== 'checkbox')) return;
      if (el.type === 'checkbox') el.checked = s[el.name]; else el.value = String(s[el.name]);
      el.removeAttribute('aria-invalid');
    });
    $('modeNote').textContent = t(`set.note.${s.wakeMode}`);
    document.querySelectorAll('[data-ai-on]').forEach(el => (el.hidden = s.aiOff)); // "Do not use AI": nothing about AI is left
    document.querySelectorAll('[data-ai-off]').forEach(el => (el.hidden = !s.aiOff));
    if (document.activeElement !== $('style')) $('style').value = s.style;
    showModels(); // the model lists hold only what the AIs reported: pick the chosen ones there
    showToken(); // a new Jira address leaves the token saved for the old one unused
  };
  const save = async (patch, el) => {
    try { show(await bridge.invoke('settings:set', patch)); $('status').textContent = t('set.saved'); }
    catch (e) {
      $('status').textContent = t('set.error', { text: errorText(e) });
      el?.setAttribute('aria-invalid', 'true');
      bridge.invoke('settings:get').then(s => show(s, el?.type === 'checkbox' ? undefined : el));
    }
  };
  bridge.invoke('settings:get').then(s => show(s));
  $('close').onclick = () => bridge.invoke('settings:close');
  addEventListener('keydown', e => { if (e.key === 'Escape') bridge.invoke('settings:close'); }); // as Teams' own dialogs
  document.addEventListener('change', ({ target: el }) => {
    if (el.name) save({ [el.name]: el.type === 'checkbox' ? el.checked : el.value.trim() }, el);
  });
  // A short note whose whole text was only in its tooltip opens in place on a click or Enter, for the keyboard and screen readers too.
  for (const note of document.querySelectorAll('.note[data-i18n-title]')) {
    const short = note.textContent, full = note.title;
    Object.assign(note, { tabIndex: 0, role: 'button' });
    note.setAttribute('aria-expanded', 'false');
    note.style.cursor = 'pointer';
    const toggle = e => { e.preventDefault(); const open = note.getAttribute('aria-expanded') !== 'true'; note.textContent = open ? full : short; note.setAttribute('aria-expanded', String(open)); };
    note.onclick = toggle;
    note.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') toggle(e); };
  }
  // Both model lists hold the models of every AI ready ("provider:model"), grouped by AI; a model the plan does not
  // include stays, greyed out with the reason, and so does a chosen one whose AI is not ready now.
  let names = {}; // provider id → its name, from the status
  const provider = id => id.slice(0, id.indexOf(':'));
  const name = id => {
    const slug = id.slice(id.indexOf(':') + 1), [, family, ...version] = slug.split('-');
    return !slug ? t('set.modelDefault') : provider(id) === 'claude' && family ? `${family[0].toUpperCase()}${family.slice(1)} ${version.join('.')}`.trim() : slug;
  };
  const traits = { opus: t('set.fam.opus'), sonnet: t('set.fam.sonnet'), haiku: t('set.fam.haiku') };
  function showModels(found = models) {
    models = found;
    for (const select of document.querySelectorAll('select[name$="Model"]')) {
      const ids = Object.keys(models).includes(current[select.name]) || !current[select.name] ? Object.keys(models) : [...Object.keys(models), current[select.name]];
      const groups = new Map();
      for (const id of ids) {
        if (!groups.has(provider(id))) groups.set(provider(id), Object.assign(document.createElement('optgroup'), { label: names[provider(id)] ?? provider(id) }));
        const o = document.createElement('option'), bad = !(id in models) || (!!models[id] && models[id] !== 'ok');
        const trait = provider(id) === 'claude' && traits[id.split('-')[1]];
        o.value = id; o.disabled = bad; o.title = bad ? models[id] ?? '' : '';
        o.textContent = name(id) + (bad ? ` — ${t('set.modelOff')}` : trait ? ` — ${trait}` : '');
        groups.get(provider(id)).append(o);
      }
      select.replaceChildren(...groups.values());
      select.value = current[select.name] ?? '';
    }
    const by = Object.groupBy(Object.keys(models), provider);
    $('modelsNote').textContent = Object.entries(by).map(([p, ids]) => `${names[p] ?? p}: ${ids.filter(id => models[id] === 'ok' || !models[id]).length}/${ids.length}`).join(' · ');
  }
  bridge.invoke('models:get').then(showModels);
  $('modelsCheck').onclick = async () => {
    $('modelsCheck').disabled = true; $('modelsNote').replaceChildren(spin(), t('set.modelsChecking'));
    try { const found = await bridge.invoke('models:check'); show(await bridge.invoke('settings:get')); showModels(found); refresh(); } // finds programs installed or signed in meanwhile; a chosen model may have moved to its family's newer version
    catch (e) { $('modelsNote').textContent = errorText(e); }
    finally { $('modelsCheck').disabled = false; }
  };
  $('style').onblur = () => save({ style: $('style').value.trim() });
  // The Jira token: typed here and handed over, never read back; the app says whether one is saved, works, and whose it is
  async function showToken() {
    const s = await bridge.invoke('jira:token'), ok = !!s && !s.other && !s.bad;
    $('jiraToken').hidden = $('jiraTokenSave').hidden = ok; // a working one is only shown as working, and can be removed
    $('jiraTokenDelete').hidden = !s;
    $('jiraTokenState').hidden = !ok;
    $('jiraTokenWarn').hidden = !s || ok; // a saved one that is not used: why, under the name
    if (ok) state($('jiraTokenState'), t('set.jiraTokenOk', { user: s.user }), 'ok');
    else if (s) $('jiraTokenWarn').textContent = t(s.other ? 'set.jiraTokenOther' : 'set.jiraTokenRejected');
  }
  async function setToken(value) {
    $('jiraTokenSave').disabled = $('jiraTokenDelete').disabled = true;
    try { await bridge.invoke('jira:tokenSet', value); $('status').textContent = t('set.saved'); }
    catch (e) { $('status').textContent = t('set.error', { text: errorText(e) }); }
    finally { $('jiraToken').value = ''; $('jiraTokenSave').disabled = $('jiraTokenDelete').disabled = false; showToken(); } // the field keeps no secret
  }
  $('jiraTokenSave').onclick = () => { const v = $('jiraToken').value.trim(); if (v) setToken(v); };
  $('jiraToken').onkeydown = e => { if (e.key === 'Enter') $('jiraTokenSave').click(); };
  $('jiraTokenDelete').onclick = () => setToken('');

  function state(el, text, tone) { const d = document.createElement('span'); d.className = 'dot ' + tone; el.replaceChildren(d, text); el.title = text; }
  // One row per AI program found here: its state and, when it needs it, «Sign in»; the ones not installed are links
  // to their own install pages.
  const el = (tag, cls, text) => Object.assign(document.createElement(tag), { className: cls ?? '', textContent: text ?? '' });
  function aiRow(p) {
    const row = el('div', 'row'), st = el('span', 'grow'), plan = p.plan ? ` · ${p.plan[0].toUpperCase()}${p.plan.slice(1)}` : '';
    const [text, tone, note] = p.error ? [t('set.aiError'), 'warn', p.error] : p.api ? [t('set.aiApi'), 'warn', t('set.aiApiNote', { name: p.name })]
      : p.loggedIn === false ? [t('set.aiLoggedOut'), 'warn'] : p.loggedIn === undefined ? [t('set.aiUnknown'), '']
      : [t('set.aiReady', { version: p.version ?? '' }) + plan, 'ok'];
    state(st, text, tone);
    row.append(el('span', 'name', p.name), st);
    if (p.loggedIn === false || p.api) row.append(Object.assign(el('button', '', t('act.signIn')), { onclick: () => bridge.invoke('ai:login', p.id) }));
    return note ? [row, el('div', 'note', note)] : [row];
  }
  let shownAi = '';
  function showAi(list, spent) {
    if (JSON.stringify(list) === shownAi) return;
    shownAi = JSON.stringify(list);
    const found = list.filter(p => p.path);
    $('aiRows').replaceChildren(...found.flatMap(aiRow));
    $('aiOthers').replaceChildren(...list.filter(p => !p.path).map(p => Object.assign(el('button', 'link', p.name), { onclick: () => bridge.invoke('ai:install', p.id) })));
    $('aiNote').textContent = !found.length ? t('set.aiNone') : spent ? t('set.spent', { n: Math.max(1, Math.round(spent / 1000)) }) : '';
    const known = JSON.stringify(names);
    names = Object.fromEntries(list.map(p => [p.id, p.name]));
    if (JSON.stringify(names) !== known) showModels();
  }
  function showStatus({ teams, ai, ready, version, spent, check }) {
    $('about').textContent = `Soroka ${version} · created by Pavlo Dykalo`;
    const broken = Object.keys(check).filter(k => check[k] === false), checked = Object.keys(check).length > 0;
    const lost = broken.map(k => t(`diag.${k}`)).join(', ');
    state($('diagState'), !checked ? t('set.diagWait') : broken.length ? t('set.diagBroken', { list: lost }) : t('set.diagOk'), !checked ? '' : broken.length ? 'warn' : 'ok');
    $('diagNote').textContent = broken.length ? t('set.diagNote', { list: lost }) : '';
    document.querySelectorAll('[data-ai]').forEach(el => (el.hidden = !ready)); // without AI only the notifications remain
    const s = { ready: ['set.teamsReady', 'ok'], login: ['set.teamsLogin', 'warn'], starting: ['set.teamsStarting', ''] }[teams];
    state($('teamsState'), t(s[0]), s[1]);
    showAi(ai, spent);
  }
  const refresh = () => bridge.invoke('status:get').then(showStatus);
  refresh(); setInterval(refresh, 3000);
  $('teamsShow').onclick = () => bridge.invoke('teams:show');
  $('diagCheck').onclick = async () => { state($('diagState'), t('set.checking'), ''); await bridge.invoke('teams:check'); refresh(); };
  $('diagCopy').onclick = async () => { await bridge.invoke('report:copy'); $('status').textContent = t('set.diagCopied'); };
  $('notifyTest').onclick = () => bridge.invoke('notify:test');
  $('styleLearn').onclick = async () => {
    $('styleLearn').disabled = true; $('styleNote').replaceChildren(spin(), t('set.styleReading'));
    try { $('style').value = await bridge.invoke('style:learn'); await save({ style: $('style').value.trim() }); $('styleNote').textContent = t('set.styleDone'); }
    catch (e) { $('styleNote').textContent = errorText(e); }
    finally { $('styleLearn').disabled = false; }
  };

  // The sections: listed on the left, one of them on screen
  const sections = [...document.querySelectorAll('section[data-sec]')];
  function open(id) {
    for (const s of sections) s.hidden = s.dataset.sec !== id;
    for (const b of $('nav').querySelectorAll('button')) b.setAttribute('aria-current', String(b.dataset.sec === id));
    $('secTitle').textContent = t(sections.find(s => s.dataset.sec === id).dataset.name);
    $('pane').scrollTop = 0;
  }
  for (const s of sections) {
    const b = el('button', '', t(s.dataset.name));
    b.dataset.sec = s.dataset.sec; b.onclick = () => open(s.dataset.sec);
    $('nav').append(b);
  }
  open('general');
</script>
</body>
</html>
