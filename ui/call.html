<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Soroka</title>
<style>
  /* Teams' ringing toast, mirrored in the look of the app's own cards (toast.html): who calls, then big buttons —
     video (an icon), accept (green) and decline (red), each pressing Teams' own button. Slides down in the top right
     corner and stays while Teams rings. */
  :root { color-scheme: light dark; --card: #ffffff; --fg: #1d1d1b; --muted: #616161; --line: rgba(0,0,0,.08); --accent: #5b5fc7; --btn: rgba(0,0,0,.05); --btn-hover: rgba(0,0,0,.1);
    --yes: #0e7a0b; --no: #c4314b; } /* white text on them at 4.5:1 or more */
  @media (prefers-color-scheme: dark) { :root { --card: #2b2b2b; --fg: #f3f3f3; --muted: #b3b3b3; --line: rgba(255,255,255,.08); --accent: #9ea2ff; --btn: rgba(255,255,255,.07); --btn-hover: rgba(255,255,255,.13); } }
  html, body { margin: 0; background: transparent; overflow: hidden; font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--fg); user-select: none; }
  [hidden] { display: none !important; }
  .card { margin: 12px 16px 20px; padding: 14px; display: grid; gap: 12px; position: relative;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 22px rgba(0,0,0,.28);
    opacity: 0; transform: translateY(-110%); transition: opacity .38s cubic-bezier(.215,.61,.355,1), transform .38s cubic-bezier(.215,.61,.355,1); }
  .card.shown { opacity: 1; transform: none; }
  .head { display: flex; gap: 12px; align-items: center; padding-right: 18px; min-width: 0; }
  .who { min-width: 0; }
  .avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 15px;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .live .avatar { animation: halo 1.6s ease-out infinite; } /* ringing: a soft pulse, like Teams' own */
  @keyframes halo { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
  @media (prefers-reduced-motion: reduce) { .live .avatar { animation: none; } }
  .kind { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kind.error { color: var(--no); }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .buttons { display: flex; gap: 8px; }
  .buttons button { font: 600 13px/1 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; color: #fff;
    display: flex; gap: 6px; align-items: center; justify-content: center; flex: 1; min-width: 0; }
  .buttons button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .buttons .video, .buttons .other { flex: none; background: var(--btn); color: var(--fg); }
  .buttons .video:hover, .buttons .other:hover { background: var(--btn-hover); }
  .buttons .yes { background: var(--yes); } .buttons .no { background: var(--no); }
  .buttons .yes:hover, .buttons .no:hover { filter: brightness(1.1); }
  .buttons svg { width: 18px; height: 18px; flex: none; }
  .no svg { transform: rotate(135deg); }
  .buttons button:disabled { opacity: .6; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .close { position: absolute; top: 8px; right: 10px; border: 0; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 2px; cursor: pointer; }
  .close:hover { color: var(--fg); }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-call" viewBox="0 0 24 24"><path fill="currentColor" d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><path fill="currentColor" d="M17 10.5V7c0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1v10c0 .6.4 1 1 1h12c.6 0 1-.4 1-1v-3.5l4 4v-11l-4 4z"/></symbol>
  </svg>
  <div class="card" id="card">
    <button class="close" id="close" data-i18n-title="call.hide">✕</button>
    <div class="head">
      <div class="avatar" id="avatar"></div>
      <div class="who"><div class="kind" id="kind"></div><div class="title" id="title"></div></div>
    </div>
    <div class="buttons" id="buttons"></div>
  </div>
<script src="i18n.js"></script>
<script type="module">
  // Texts and Teams' own button labels come from Teams: textContent and titles only.
  await i18n;
  const $ = id => document.getElementById(id);
  $('close').onclick = () => bridge.invoke('ring:dismiss');
  const initials = name => name.split(/\s+/).filter(w => /^\p{L}/u.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '📞';
  // ponytail: "accept with video" is told by Teams' label in a ru/uk/en Teams; in another language it stays a plain button
  const VIDEO = /відео|видео|video/i;
  const icon = (id, text) => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'), use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', `#${id}`); svg.append(use);
    const parts = [svg];
    if (text) { const s = document.createElement('span'); s.textContent = text; parts.push(s); }
    return parts;
  };
  bridge.on('ring', async r => {
    if (!r) return;
    const call = r.kind === 'call';
    $('card').classList.toggle('live', r.live);
    $('kind').classList.remove('error');
    $('avatar').textContent = call ? initials(r.title) : '📅';
    const kind = t(call ? 'call.incoming' : r.live ? 'call.meeting' : 'call.meetingGone');
    $('kind').textContent = $('kind').title = r.message ? `${kind} · ${r.message}` : kind;
    $('title').textContent = $('title').title = r.title || t(call ? 'call.incoming' : 'call.meeting');
    // video first (an icon), then the first other accept/join (green), the rest as they are, decline last (red);
    // once Teams' own meeting toast is gone only "Join" is left
    const buttons = r.buttons.map((b, i) => ({ ...b, i })).filter(b => r.live || !b.reject);
    const video = buttons.filter(b => !b.reject && VIDEO.test(b.label));
    const rest = buttons.filter(b => !b.reject && !video.includes(b));
    const ordered = [...video, ...rest, ...buttons.filter(b => b.reject)];
    $('buttons').replaceChildren(...ordered.map(b => {
      const e = document.createElement('button');
      e.title = b.label || '';
      if (b.reject) { e.className = 'no'; e.append(...icon('i-call', t('call.decline'))); }
      else if (video.includes(b)) { e.className = 'video'; e.setAttribute('aria-label', b.label); e.append(...icon('i-video')); }
      else if (b === rest[0]) { e.className = 'yes'; e.append(...icon('i-call', t(call ? 'call.accept' : 'call.join'))); }
      else { e.className = 'other'; e.textContent = b.label; }
      // a click that did not reach Teams leaves the card up, saying so: Teams' window comes up with its own buttons
      e.onclick = () => {
        const all = [...$('buttons').children];
        all.forEach(x => (x.disabled = true));
        bridge.invoke('ring:click', b.i).catch(err => {
          all.forEach(x => (x.disabled = false));
          $('kind').textContent = $('kind').title = String(err.message || err).replace(/^Error invoking remote method '[^']+': (Error: )?/, '');
          $('kind').classList.add('error');
        });
      };
      return e;
    }));
    await bridge.invoke('ring:size', $('card').offsetHeight + 32); // + margins left for the shadow
    requestAnimationFrame(() => $('card').classList.add('shown'));
  });
</script>
</body>
</html>
