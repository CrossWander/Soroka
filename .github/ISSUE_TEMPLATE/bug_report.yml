name: Bug report
description: Something in Soroka does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Soroka works with your work chats, so **keep private data out of this issue**:
        no chat contents, names of colleagues or chats, `token.txt`, tokens or screenshots of real conversations.
        A security problem goes to a [private report](https://github.com/CrossWander/Soroka/security/advisories/new), not here.

  - type: input
    id: version
    attributes:
      label: Soroka version
      description: In the footer of Soroka's settings.
      placeholder: "0.30.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: setup
    attributes:
      label: Teams language and AI
      description: The language Teams is in, and which AI program Soroka uses (or none).
      placeholder: "Teams in English, Claude Code"

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what Soroka did instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...

  - type: textarea
    id: report
    attributes:
      label: Report for the author
      description: |
        Settings → «report for the author» in the footer copies the versions and the Teams check, without chat contents.
        Lines from `%APPDATA%\Soroka\soroka.log` help too, but read them first: some lines carry chat names.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no chat contents, colleagues' names, tokens or other private data.
          required: true
